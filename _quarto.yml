project:
  type: website
  resources:
    - robots.txt

website:
  title: "Dr Steven Turnbull"
  favicon: static/pictures/favicon.svg
  navbar:
    logo:
      light:
        path: static/pictures/smt-logo-light.svg
        alt: "SMT"
      dark:
        path: static/pictures/smt-logo-dark.svg
        alt: "SMT"
    title: false
    left:
      - text: About
        href: about.qmd
      - text: Blog
        href: blog.qmd
      - text: Publications
        href: publications.qmd
      - text: Visualisations
        href: visualisations.qmd
      - text: AI use
        href: ai-use.qmd
    right:
      - icon: github
        href: https://github.com/sturbull/
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/steven-turnbull-122b73156/
        aria-label: LinkedIn
      - text: '<i class="ai ai-google-scholar" role="img" aria-label="Google Scholar" title="Google Scholar"></i>'
        href: https://scholar.google.co.nz/citations?user=PkOOJWIAAAAJ&hl=en
      - text: '<i class="ai ai-orcid" role="img" aria-label="ORCID" title="ORCID"></i>'
        href: https://orcid.org/0000-0003-3325-4886
      - text: '<i class="ai ai-researchgate" role="img" aria-label="ResearchGate" title="ResearchGate"></i>'
        href: https://www.researchgate.net/profile/Steven-Turnbull-2
  page-footer:
    left: '© Steven Turnbull · <i class="bi bi-cc-circle"></i> [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)'
    right:
      - text: AI use
        href: ai-use.qmd

format:
  html:
    template-partials: 
      - title-block.html
    theme:
      light: [flatly, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: styles.css
    include-in-header:
      - _ai-optout.html
      - text: '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">'
    include-after-body: _glow.html
    toc: true
    title-block-banner: true

editor: visual

execute:
  freeze: auto

