<style>
  #particles-js {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 100%;
    height: 100%;
    z-index: 0; /* Ensure particles are behind the content */
  }

  .title-block-content {
    position: relative; /* Needed to ensure z-index works */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding-top: 130px;
    padding-bottom: 130px;
    z-index: 1; /* Set content above particles */
  }

  .smt-title-logo {
    height: 32px;
    width: auto;
    margin-bottom: 20px;
  }
</style>

<header id="title-block-header" class="quarto-title-block" style="position: relative">
  <!-- This is the div in which the particles will be included -->
  <div id="particles-js"></div>

  <!-- Actual content on top of the particles-->
  <div class="title-block-content">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="28 -712 2259 724" width="200" height="64" class="smt-title-logo" role="img" aria-label="SMT"><path fill="currentColor" d="M313 12Q229 12 152.0 -10.5Q75 -33 28 -69L83 -191Q127 -159 189.0 -138.5Q251 -118 314 -118Q386 -118 417.5 -139.0Q449 -160 449 -193Q449 -221 427.0 -237.5Q405 -254 368.5 -264.5Q332 -275 289.0 -284.5Q246 -294 202.5 -307.5Q159 -321 122.5 -343.5Q86 -366 64.0 -402.5Q42 -439 42 -494Q42 -554 74.5 -603.5Q107 -653 172.5 -682.5Q238 -712 337 -712Q403 -712 467.0 -696.0Q531 -680 580 -650L530 -527Q481 -555 431.5 -568.5Q382 -582 336 -582Q264 -582 233.5 -558.5Q203 -535 203 -502Q203 -475 225.0 -458.5Q247 -442 283.0 -431.5Q319 -421 362.5 -412.0Q406 -403 449.5 -389.5Q493 -376 529.5 -354.0Q566 -332 588.0 -296.0Q610 -260 610 -205Q610 -146 577.5 -97.0Q545 -48 479.0 -18.0Q413 12 313 12ZM761.0 0V-700H895.0L1157.0 -265L1415.0 -700H1548.0L1550.0 0H1398.0L1397.0 -419L1191.0 -74H1118.0L913.0 -412V0ZM1901.0 0V-568H1677.0V-700H2287.0V-568H2063.0V0Z"/></svg>
    $if(title)$
    <h1 class="title">$title$</h1>
    $endif$
    $if(subtitle)$
    <p class="subtitle">$subtitle$</p>
    $endif$ 
    $if(quarto-title-block)$
    <p class="quarto-title-block">$quarto-title-block$</p>
    $endif$ 
    $for(author)$
    <p class="author">$author$</p>
    $endfor$ 
    $if(date)$
    <p class="date">$date$</p>
    $endif$ 
    $if(abstract)$
    <div class="abstract">
      <div class="abstract-title">$abstract-title$</div>
      $abstract$
    </div>
    $endif$
  </div>

  <!-- Particle.js script loaded from a CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>

  <!-- use the particle js library with our own config (json file). -->
  <script>
    particlesJS.load("particles-js", "https://raw.githubusercontent.com/sturbull/sturbull.github.io/main/particles.json");
  </script>
</header>
