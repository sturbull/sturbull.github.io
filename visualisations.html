const typesetMath = (el) => {

    // MathJax Typeset
    window.MathJax.typeset([el]);

    // KaTeX Render
    var mathElements = el.getElementsByClassName("math");

    for (var i = 0; i < mathElements.length; i++) {
      var texText = mathElements[i].firstChild;
      if (mathElements[i].tagName == "SPAN" && texText && texText.data) {
        window.katex.render(texText.data, mathElements[i], {
          displayMode: mathElements[i].classList.contains('display'),
          throwOnError: false,
          macros: macros,
          fleqn: false
        });
      }
    }
  }
}
window.Quarto = {

};
</script>

<script>
  // Edge light: tracks the pointer position relative to each .smt-glow element
  // as --mx/--my, which styles.css uses to place a mustard radial gradient.
  if (window.matchMedia("(hover: hover)").matches) {
    let frame = 0;
    document.addEventListener("pointermove", (e) => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        for (const el of document.querySelectorAll(".smt-glow")) {
          const r = el.getBoundingClientRect();
          el.style.setProperty("--mx", `${e.clientX - r.left}px`);
          el.style.setProperty("--my", `${e.clientY - r.top}px`);
        }
      });
    });
  }
</script>
<script>
  // Fireflies: adds a fixed layer of spans behind the page, each with a random
  // position, size, wander path and glow timing as custom properties that
  // styles.css animates. Negative delays start each one mid-cycle.
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const rand = (min, max) => min + Math.random() * (max - min);
    const layer = document.createElement("div");
    layer.className = "smt-fireflies";
    layer.setAttribute("aria-hidden", "true");
    const count = window.innerWidth < 720 ? 8 : 14;
    for (let i = 0; i < count; i++) {
      const fly = document.createElement("span");
      const wander = rand(18, 32);
      fly.style.cssText = [
        `--x: ${rand(2, 98)}%`,
        `--y: ${rand(5, 95)}%`,
        `--size: ${rand(3, 5)}px`,
        `--dx: ${rand(-12, 12)}vw`,
        `--dy: ${rand(-10, 10)}vh`,
        `--wander: ${wander}s`,
        `--blink: ${rand(4, 9)}s`,
        `--delay: ${-rand(0, wander)}s`,
        `--peak: ${rand(0.5, 0.9)}`,
      ].join(";");
      layer.append(fly);
    }
    document.body.prepend(layer);
  }
</script>
